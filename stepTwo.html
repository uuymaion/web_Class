<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北市大臨時停車系統</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_stepTwo.css">
</head>
<body>
  <section class="screen" id="step2">
    <div class="page">
      <div class="step-indicator">
        <p class="step-text">步驟 2 / 2</p>
        <div class="step-bars">
          <span class="step-bar"></span>
          <span class="step-bar active"></span>
        </div>
      </div>
      <form id="step2Form" novalidate>
        <div class="card" id="vehicleList">
          <div class="vehicle-group">
            <div class="field">
              <label>車號</label>
              <input type="text" name="plateNo[]" required>
            </div>
            <div class="field">
              <label>駕駛人姓名</label>
              <input type="text" name="driverName[]" required>
            </div>
            <div class="field last">
              <label>駕駛人手機號碼</label>
              <input type="tel" name="driverPhone[]" required>
            </div>
          </div>
        </div>
        <p class="hint">*申請車輛至多10台</p>
        <button type="button" class="addcar-btn" id="addVehicleBtn">＋</button>
        <div class="bottom-bar">
          <a href="index.html"><button type="button" class="secondary-btn" id="backBtn">上一步</button></a>
          <button type="submit" class="primary-btn">送出申請</button>
        </div>
      </form>
    </div>
  </section>

  <script src="script_stepTwo.js"></script>
</body>
</html>
