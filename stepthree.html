<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>登記成功 - 北市大臨時停車系統</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <section class="screen">

        <div class="page">

            <div class="card success-card">

                <!-- 成功圖示 -->
                <div class="success-icon">
                    ✓
                </div>

                <h1>登記成功</h1>

                <p>
                    您的停車申請已成功送出！
                </p>


                <!-- 登記資料 -->
                <div class="registration-info">

                    <h2>登記資料</h2>

                    <div id="vehicleInfo"></div>

                </div>


                <!-- 回首頁 -->
                <button
                    type="button"
                    class="primary-btn"
                    onclick="window.location.href='index.html'">

                    回到首頁

                </button>

            </div>

        </div>

    </section>


    <script>

        // 取得第二頁送過來的完整資料
        const data = JSON.parse(
            sessionStorage.getItem("registrationData") || "{}"
        );


        // 找到顯示車輛資料的區域
        const vehicleInfo =
            document.getElementById("vehicleInfo");


        // 取得車輛資料
        const vehicles = data.vehicles || [];


        // 一台一台顯示
        vehicles.forEach((vehicle, index) => {

            const vehicleDiv =
                document.createElement("div");

            vehicleDiv.className = "vehicle-result";


            vehicleDiv.innerHTML = `
                <p>
                    <strong>車輛 ${index + 1}</strong>
                </p>

                <p>
                    車號：${vehicle.plateNo}
                </p>

                <p>
                    駕駛人：${vehicle.driverName}
                </p>

                <p>
                    手機：${vehicle.driverPhone}
                </p>
            `;


            vehicleInfo.appendChild(vehicleDiv);

        });

    </script>

</body>

</html>
