<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查詢 - 北市大臨時停車系統</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/styles_search.css">
</head>
<body>
  <section class="screen" id="search">
    <div class="page">

      <!-- 登記人查詢 -->
      <h1 class="page-title">查詢申請</h1>

      <!-- 先選身分 -->
      <fieldset class="role-picker">
        <legend class="sr-only">選擇查詢身分</legend>

        <label class="role-tile">
          <input type="radio" name="role" value="applicant" checked>
          <span class="role-icon" aria-hidden="true">📝</span>
          <span class="role-text">
            <b>我是登記人</b>
            <small>查看、取消、重新送審</small>
          </span>
          <span class="role-radio" aria-hidden="true"></span>
        </label>

        <label class="role-tile">
          <input type="radio" name="role" value="driver">
          <span class="role-icon" aria-hidden="true">🚗</span>
          <span class="role-text">
            <b>我是駕駛人</b>
            <small>查看自己的停車資格</small>
          </span>
          <span class="role-radio" aria-hidden="true"></span>
        </label>
      </fieldset>

      <!-- 再填資料 -->
      <form class="card search-form" id="searchForm" novalidate>
        <div class="field">
          <label for="queryName" id="nameLabel">登記人姓名</label>
          <input type="text" id="queryName" autocomplete="name" placeholder="請輸入姓名">
        </div>
        <div class="field">
          <label for="queryPhone" id="phoneLabel">登記人手機號碼</label>
          <input type="tel" id="queryPhone" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxx">
        </div>
        <button type="submit" class="primary-btn search-btn">查詢</button>
      </form>
      <div class="bottom-bar">
        <button type="button" class="primary-btn" id="homeBtn">返回首頁</button>
      </div>
    </div>
  </section>

  <script src="js/debug.js"></script>
  <script src="js/script_search.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
