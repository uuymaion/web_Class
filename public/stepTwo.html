<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北市大臨時停車系統</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_stepTwo.css">
</head>
<body>
  <section class="screen" id="step2">
    <div class="page">
      <div class="step-indicator">
        <p class="step-text">步驟 2 / 2</p>
        <div class="step-bars">
          <span class="step-bar"></span>
          <span class="step-bar active"></span>
        </div>
      </div>
      <form id="step2Form" novalidate>
        <div class="card" id="vehicleList">
          <div class="vehicle-group">
            <button type="button" class="delete-btn" aria-label="刪除此車輛">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
            <div class="field">
              <label class="plate-label">車號 1</label>
              <input type="text" name="plateNo[]" required>
            </div>
            <div class="field">
              <label>駕駛人姓名</label>
              <input type="text" name="driverName[]" required>
            </div>
            <div class="field last">
              <label>駕駛人手機號碼</label>
              <input type="tel" name="driverPhone[]" required>
            </div>
          </div>
        </div>
        <p class="hint-car">*申請車輛至多10台(已登記 <span id="vehicleCount">1</span> / 10)</p>
        <button type="button" class="addcar-btn" id="addVehicleBtn">＋</button>
        <div class="bottom-bar">
          <button type="button" class="secondary-btn" id="backBtn">上一步</button>
          <button type="submit" class="primary-btn">送出申請</button>
        </div>
      </form>
    </div>
  </section>

  <script src="script_stepTwo.js"></script>
</body>
</html>
