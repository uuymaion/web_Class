<!DOCTYPE html>   <!-- 宣告 HTML5 文件 -->
<html lang="zh-Hant">   <!-- 網頁使用繁體中文 -->
<head>   <!-- 設定網頁資訊 -->
<meta charset="UTF-8">   <!-- 設定文字編碼，避免中文亂碼 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- 讓網頁適應不同裝置的螢幕大小 -->
<title>北市大臨時停車系統</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_stepOne.css">
</head>
<body>
  <section class="screen" id="step1">
    <div class="page">
      <h1 class="page-title">北市大臨時停車系統</h1>
      <div class="step-indicator">
        <p class="step-text">步驟 1 / 2</p>
        <div class="step-bars">
          <span class="step-bar active"></span>
          <span class="step-bar"></span>
        </div>
      </div>
      <form class="parking-form" id="step1Form" novalidate> 
        <!-- 新增 novalidate 屬性，阻止瀏覽器自己驗證 -->
        <div class="card">   <!-- 建立第一張卡片，放置活動相關資料 -->
          <div class="field">   <!-- 建立一個輸入欄位區塊 -->
            <label for="unit">申請單位/系所</label>   <!-- 顯示欄位名稱，for 對應輸入框的 id -->
            <p class="hint">*非本校請填寫訪客</p>   <!-- 顯示輸入提示，hint 用於套用提示文字樣式 -->
            <input type="text" id="unit" name="unit" required>   <!-- 建立文字輸入框，required 表示必填 -->
          </div>   <!-- 結束申請單位欄位 -->
          
          <div class="field">   <!-- 建立活動名稱欄位 -->
            <label for="eventName">活動名稱</label>   <!-- 顯示活動名稱標籤 -->
            <input type="text" id="eventName" name="eventName" required>   <!-- 建立活動名稱文字輸入框，必須填寫 -->
          </div>   <!-- 結束活動名稱欄位 -->

          <div class="field">   <!-- 建立活動起始日期欄位 -->
            <label for="startDate">活動/停車起始日期</label>   <!-- 顯示活動或停車起始日期標籤 -->
            <input type="date" id="startDate" name="startDate" required>   <!-- 建立起始日期輸入欄位 -->
          </div>   <!-- 結束活動起始日期欄位 -->
          
          <div class="field">   <!-- 建立活動結束日期欄位 -->
            <label for="endDate">活動/停車結束日期</label>   <!-- 顯示活動或停車結束日期標籤 -->
            <input type="date" id="endDate" name="endDate" required>   <!-- 建立結束日期輸入欄位 -->
          </div>   <!-- 結束活動結束日期欄位 -->
          <!-- 只能選今天以後，並且結束日期不能早於開始日期 -->

          <div class="field last">   <!-- 建立停車校區欄位，last 可用來設定最後一個欄位的樣式 -->
            <label>停車校區</label>
            <div class="checkbox-row">   <!-- 將校區選項放在同一個排列區塊 -->
              <label class="checkbox-option">   <!-- 建立博愛校區的核取方塊選項 -->
                <input type="radio" name="area" value="博愛校區" required>
                <span class="box"></span>   <!-- 提供 CSS 自訂核取方塊外觀的元素 -->
                博愛校區   <!-- 顯示博愛校區文字 -->
              </label>   <!-- 結束博愛校區選項 -->

              <label class="checkbox-option">   <!-- 建立天母校區的核取方塊選項 -->
                <input type="radio" name="area" value="天母校區" required>
                <span class="box"></span>   <!-- 提供 CSS 自訂核取方塊外觀的元素 -->
                天母校區   <!-- 顯示天母校區文字 -->
              </label>   <!-- 結束天母校區選項 -->
            </div>   <!-- 結束校區選項排列區塊 -->
          </div>   <!-- 結束停車校區欄位 -->
        </div>   <!-- 結束第一張卡片 -->

        <div class="card">   <!-- 建立第二張卡片，放置申請人資料 -->
          <div class="field">   <!-- 建立申請人姓名欄位 -->
            <label for="applicantName">申請人姓名</label>   <!-- 顯示申請人姓名標籤 -->
            <p class="hint">*若申請車輛超過10台，建議僅填寫帶隊聯絡人，並將完整車牌清單寄至總務處信箱</p>  
            <input type="text" id="applicantName" name="applicantName" required>   <!-- 建立申請人姓名輸入框，必須填寫 -->
          </div>   <!-- 結束申請人姓名欄位 -->

          <div class="field">   <!-- 建立申請人 Email 欄位 -->
            <label for="applicantEmail">申請人email</label>   <!-- 顯示申請人 Email 標籤 -->
            <input type="email" id="applicantEmail" name="applicantEmail" required>   <!-- 建立 Email 輸入框，必須符合基本 Email 格式 -->
          </div>   <!-- 結束申請人姓名欄位 -->

          <div class="field">
            <label for="applicantPhone">申請人聯絡電話</label>
            <input type="tel" id="applicantPhone" name="applicantPhone" required>
          </div>

          <div class="field last">
            <label for="supervisorName">申請單位主管姓名</label>
            <input type="text" id="supervisorName" name="supervisorName" required>
          </div>

          <div class="field last">   <!-- 建立最後一個欄位，last 可用來調整欄位間距 -->
            <label for="supervisorEmail">申請單位主管email</label>   <!-- 顯示主管 Email 標籤 -->
            <input type="email" id="supervisorEmail" name="supervisorEmail" required>   <!-- 建立主管 Email 輸入框，必須填寫 -->
          </div>   <!-- 結束主管 Email 欄位 -->
        </div>   <!-- 結束第二張卡片 -->

        <div class="card notice-card">   <!-- 建立注意事項卡片，notice-card 可設定專屬樣式 -->
          <label class="checkbox-option notice-title">   <!-- 建立注意事項的勾選選項 -->
            <input type="checkbox" name="agree" value="agree" required>   <!-- 建立同意核取方塊，必須勾選 -->
            <span class="box"></span>   <!-- 提供 CSS 自訂核取方塊外觀的元素 -->
            注意事項   <!-- 顯示注意事項標題 -->
          </label>   <!-- 結束注意事項勾選選項 -->

          <p class="notice-text">
            (一)車輛進出停車場一律按規定路線、限速行駛，並應停在停車格內，不得任意停放妨礙交通，違規者將拒絕再次申請。
          </p>
          <p class="notice-text">
            (二)本停車場僅提供車位，對車輛及車內物品不負保管責任，若造成損壞或遺失，概不負責，地震及颱風等天災時亦同。若於校園發生擦撞事故，由雙方人員自行解決，與於本校無涉。
          </p>
          <label class="checkbox-option notice-deadline">
            <input type="checkbox" name="deadlineAck" value="ack" required>
            <span class="box"></span>
            申請期限為活動2日前提出（扣除例假日）
          </label>
        </div>
        <div class="bottom-bar">
          <a href="stepTwo.html"><button type="submit" class="primary-btn">下一步</button></a>
          <a href="index.html"><button type="button" class="primary-btn">返回首頁</button></a>
        </div>
      </form>
    </div>
  </section>
  <script src="debug.js"></script>
  <script src="script_stepOne.js"></script>
</body>
</html>
