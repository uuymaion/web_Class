<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北市大臨時停車系統</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Step 1: 申請資料 -->
  <section class="screen" id="step1">
    <div class="page">
      <h1 class="page-title">北市大臨時停車系統</h1>

      <form class="parking-form" id="step1Form">
        <div class="card">
          <div class="field">
            <label for="unit">申請單位/系所</label>
            <p class="hint">*非本校請填寫訪客</p>
            <input type="text" id="unit" name="unit">
          </div>

          <div class="field">
            <label for="eventName">活動名稱</label>
            <input type="text" id="eventName" name="eventName">
          </div>

          <div class="field">
            <label for="eventDate">活動/停車日期</label>
            <input type="text" id="eventDate" name="eventDate">
          </div>

          <div class="field last">
            <label>停車校區</label>
            <div class="checkbox-row">
              <label class="checkbox-option">
                <input type="checkbox" name="campus" value="博愛校區">
                <span class="box"></span>
                博愛校區
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="campus" value="天母校區">
                <span class="box"></span>
                天母校區
              </label>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="field">
            <label for="applicantName">申請人姓名</label>
            <p class="hint">*若申請車輛超過10台，建議僅填寫帶隊聯絡人，並將完整車牌清單寄至總務處信箱</p>
            <input type="text" id="applicantName" name="applicantName">
          </div>

          <div class="field">
            <label for="applicantEmail">申請人email</label>
            <input type="email" id="applicantEmail" name="applicantEmail">
          </div>

          <div class="field">
            <label for="supervisorName">申請單位主管姓名</label>
            <input type="text" id="supervisorName" name="supervisorName">
          </div>

          <div class="field last">
            <label for="supervisorEmail">申請單位主管email</label>
            <input type="email" id="supervisorEmail" name="supervisorEmail">
          </div>
        </div>

        <div class="card notice-card">
          <label class="checkbox-option notice-title">
            <input type="checkbox" name="agree" value="agree">
            <span class="box"></span>
            注意事項
          </label>
          <p class="notice-text">
            (一)車輛進出停車場一律按規定路線、限速行駛，並應停在停車格內，不得任意停放妨礙交通，違規者將拒絕再次申請。
          </p>
          <p class="notice-text">
            (二)本停車場僅提供車位，對車輛及車內物品不負保管責任，若造成損壞或遺失，概不負責，地震及颱風等天災時亦同。若於校園發生擦撞事故，由雙方人員自行解決，與於本校無涉。
          </p>
          <label class="checkbox-option notice-deadline">
            <input type="checkbox" name="deadlineAck" value="ack">
            <span class="box"></span>
            申請期限為活動2日前提出（扣除例假日）
          </label>
        </div>

        <a href="stepTwo.html"><button type="submit" class="primary-btn">下一步</button></a>
      </form>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
